apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulntracker
spec:
  podSelector:
    matchLabels:
      app: vulntracker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 443